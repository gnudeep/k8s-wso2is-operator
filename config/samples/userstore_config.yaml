apiVersion: iam.wso2.com/v1beta1
kind: Userstore
metadata:
  name: corporate-userstore
spec:
  typeId: VW5pcXVlSURKREJDVXNlclN0b3JlTWFuYWdlcg
  description: Secondary JDBC userstore for corporate user directory
  name: CORPORATE
  insecureSkipVerify: true
  properties:
    - name: url
      value: jdbc:postgresql://corporate-db:5432/corporate_users
    - name: userName
      value: dbadmin
    - name: password
      value: dbpassword
    - name: driverName
      value: org.postgresql.Driver
auth:
  host: wso2is-service.default.svc.cluster.local:9443
  username: admin
  password: admin
