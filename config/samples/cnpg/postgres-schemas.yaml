---
apiVersion: v1
data:
  shared.sql: "CREATE TABLE IF NOT EXISTS REG_CLUSTER_LOCK (\n             REG_LOCK_NAME
    VARCHAR (20),\n             REG_LOCK_STATUS VARCHAR (20),\n             REG_LOCKED_TIME
    TIMESTAMP,\n             REG_TENANT_ID INTEGER DEFAULT 0,\n             PRIMARY
    KEY (REG_LOCK_NAME)\n);\n\nCREATE SEQUENCE IF NOT EXISTS REG_LOG_PK_SEQ;\nCREATE
    TABLE IF NOT EXISTS REG_LOG (\n             REG_LOG_ID INTEGER DEFAULT NEXTVAL('REG_LOG_PK_SEQ'),\n
    \            REG_PATH VARCHAR (2000),\n             REG_USER_ID VARCHAR (255)
    NOT NULL,\n             REG_LOGGED_TIME TIMESTAMP NOT NULL,\n             REG_ACTION
    INTEGER NOT NULL,\n             REG_ACTION_DATA VARCHAR (500),\n             REG_TENANT_ID
    INTEGER DEFAULT 0,\n             PRIMARY KEY (REG_LOG_ID, REG_TENANT_ID)\n);\n\nCREATE
    INDEX REG_LOG_IND_BY_REG_LOGTIME ON REG_LOG(REG_LOGGED_TIME, REG_TENANT_ID);\n\nCREATE
    SEQUENCE IF NOT EXISTS REG_PATH_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_PATH(\n
    \            REG_PATH_ID INTEGER DEFAULT NEXTVAL('REG_PATH_PK_SEQ'),\n             REG_PATH_VALUE
    VARCHAR(2000) NOT NULL,\n             REG_PATH_PARENT_ID INTEGER,\n             REG_TENANT_ID
    INTEGER DEFAULT 0,\n             CONSTRAINT PK_REG_PATH PRIMARY KEY(REG_PATH_ID,
    REG_TENANT_ID),\n             CONSTRAINT UNIQUE_REG_PATH_TENANT_ID UNIQUE (REG_PATH_VALUE,REG_TENANT_ID)\n);\n\nCREATE
    INDEX REG_PATH_IND_BY_PATH_PARENT_ID  ON REG_PATH(REG_PATH_PARENT_ID, REG_TENANT_ID);\n\nCREATE
    SEQUENCE IF NOT EXISTS REG_CONTENT_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_CONTENT
    (\n             REG_CONTENT_ID INTEGER DEFAULT NEXTVAL('REG_CONTENT_PK_SEQ'),\n
    \            REG_CONTENT_DATA BYTEA,\n             REG_TENANT_ID INTEGER DEFAULT
    0,\n             CONSTRAINT PK_REG_CONTENT PRIMARY KEY(REG_CONTENT_ID, REG_TENANT_ID)\n);\n\nCREATE
    TABLE IF NOT EXISTS REG_CONTENT_HISTORY (\n             REG_CONTENT_ID INTEGER
    NOT NULL,\n             REG_CONTENT_DATA BYTEA,\n             REG_DELETED   SMALLINT,\n
    \            REG_TENANT_ID INTEGER DEFAULT 0,\n             CONSTRAINT PK_REG_CONTENT_HISTORY
    PRIMARY KEY(REG_CONTENT_ID, REG_TENANT_ID)\n);\n\nCREATE SEQUENCE IF NOT EXISTS
    REG_RESOURCE_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_RESOURCE (\n            REG_PATH_ID
    \        INTEGER NOT NULL,\n            REG_NAME            VARCHAR(256),\n            REG_VERSION
    \        INTEGER DEFAULT NEXTVAL('REG_RESOURCE_PK_SEQ'),\n            REG_MEDIA_TYPE
    \     VARCHAR(500),\n            REG_CREATOR         VARCHAR(255) NOT NULL,\n
    \           REG_CREATED_TIME    TIMESTAMP NOT NULL,\n            REG_LAST_UPDATOR
    \   VARCHAR(255),\n            REG_LAST_UPDATED_TIME    TIMESTAMP NOT NULL,\n
    \           REG_DESCRIPTION     VARCHAR(1000),\n            REG_CONTENT_ID      INTEGER,\n
    \           REG_TENANT_ID INTEGER DEFAULT 0,\n            REG_UUID VARCHAR(100)
    NOT NULL,\n            CONSTRAINT PK_REG_RESOURCE PRIMARY KEY(REG_VERSION, REG_TENANT_ID)\n);\n\nALTER
    TABLE REG_RESOURCE ADD CONSTRAINT REG_RESOURCE_FK_BY_PATH_ID FOREIGN KEY (REG_PATH_ID,
    REG_TENANT_ID) REFERENCES REG_PATH (REG_PATH_ID, REG_TENANT_ID);\nALTER TABLE
    REG_RESOURCE ADD CONSTRAINT REG_RESOURCE_FK_BY_CONTENT_ID FOREIGN KEY (REG_CONTENT_ID,
    REG_TENANT_ID) REFERENCES REG_CONTENT (REG_CONTENT_ID, REG_TENANT_ID);\nCREATE
    INDEX REG_RESOURCE_IND_BY_NAME  ON REG_RESOURCE(REG_NAME, REG_TENANT_ID);\nCREATE
    INDEX REG_RESOURCE_IND_BY_PATH_ID_NAME  ON REG_RESOURCE(REG_PATH_ID, REG_NAME,
    REG_TENANT_ID);\nCREATE INDEX REG_RESOURCE_IND_BY_UUID  ON REG_RESOURCE(REG_UUID);\nCREATE
    INDEX REG_RESOURCE_IND_BY_TENANT ON REG_RESOURCE(REG_TENANT_ID, REG_UUID);\nCREATE
    INDEX REG_RESOURCE_IND_BY_TYPE ON REG_RESOURCE(REG_TENANT_ID, REG_MEDIA_TYPE);\n\nCREATE
    TABLE IF NOT EXISTS REG_RESOURCE_HISTORY (\n            REG_PATH_ID         INTEGER
    NOT NULL,\n            REG_NAME            VARCHAR(256),\n            REG_VERSION
    \        INTEGER NOT NULL,\n            REG_MEDIA_TYPE      VARCHAR(500),\n            REG_CREATOR
    \        VARCHAR(255) NOT NULL,\n            REG_CREATED_TIME    TIMESTAMP NOT
    NULL,\n            REG_LAST_UPDATOR    VARCHAR(255),\n            REG_LAST_UPDATED_TIME
    \   TIMESTAMP NOT NULL,\n            REG_DESCRIPTION     VARCHAR(1000),\n            REG_CONTENT_ID
    \     INTEGER,\n            REG_DELETED         SMALLINT,\n            REG_TENANT_ID
    INTEGER DEFAULT 0,\n            REG_UUID VARCHAR(100) NOT NULL,\n            CONSTRAINT
    PK_REG_RESOURCE_HISTORY PRIMARY KEY(REG_VERSION, REG_TENANT_ID)\n);\n\nALTER TABLE
    REG_RESOURCE_HISTORY ADD CONSTRAINT REG_RESOURCE_HIST_FK_BY_PATHID FOREIGN KEY
    (REG_PATH_ID, REG_TENANT_ID) REFERENCES REG_PATH (REG_PATH_ID, REG_TENANT_ID);\nALTER
    TABLE REG_RESOURCE_HISTORY ADD CONSTRAINT REG_RESOURCE_HIST_FK_BY_CONTENT_ID FOREIGN
    KEY (REG_CONTENT_ID, REG_TENANT_ID) REFERENCES REG_CONTENT_HISTORY (REG_CONTENT_ID,
    REG_TENANT_ID);\nCREATE INDEX REG_RESOURCE_HISTORY_IND_BY_NAME  ON REG_RESOURCE_HISTORY(REG_NAME,
    REG_TENANT_ID);\nCREATE INDEX REG_RESOURCE_HISTORY_IND_BY_PATH_ID_NAME  ON REG_RESOURCE(REG_PATH_ID,
    REG_NAME, REG_TENANT_ID);\n\nCREATE SEQUENCE IF NOT EXISTS REG_COMMENT_PK_SEQ;\nCREATE
    TABLE IF NOT EXISTS REG_COMMENT (\n            REG_ID        INTEGER DEFAULT NEXTVAL('REG_COMMENT_PK_SEQ'),\n
    \           REG_COMMENT_TEXT      VARCHAR(500) NOT NULL,\n            REG_USER_ID
    \          VARCHAR(255) NOT NULL,\n            REG_COMMENTED_TIME    TIMESTAMP
    NOT NULL,\n            REG_TENANT_ID INTEGER DEFAULT 0,\n            CONSTRAINT
    PK_REG_COMMENT PRIMARY KEY(REG_ID, REG_TENANT_ID)\n);\n\nCREATE SEQUENCE IF NOT
    EXISTS REG_RESOURCE_COMMENT_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_RESOURCE_COMMENT
    (\n            ID                      INTEGER DEFAULT NEXTVAL('REG_RESOURCE_COMMENT_PK_SEQ'),\n
    \           REG_COMMENT_ID          INTEGER NOT NULL,\n            REG_VERSION
    \            INTEGER,\n            REG_PATH_ID             INTEGER,\n            REG_RESOURCE_NAME
    \      VARCHAR(256),\n            REG_TENANT_ID INTEGER DEFAULT 0,\n            PRIMARY
    KEY (ID)\n);\n\nALTER TABLE REG_RESOURCE_COMMENT ADD CONSTRAINT REG_RESOURCE_COMMENT_FK_BY_PATH_ID
    FOREIGN KEY (REG_PATH_ID, REG_TENANT_ID) REFERENCES REG_PATH (REG_PATH_ID, REG_TENANT_ID);\nALTER
    TABLE REG_RESOURCE_COMMENT ADD CONSTRAINT REG_RESOURCE_COMMENT_FK_BY_COMMENT_ID
    FOREIGN KEY (REG_COMMENT_ID, REG_TENANT_ID) REFERENCES REG_COMMENT (REG_ID, REG_TENANT_ID);\nCREATE
    INDEX REG_RESOURCE_COMMENT_IND_BY_PATH_ID_AND_RESOURCE_NAME  ON REG_RESOURCE_COMMENT(REG_PATH_ID,
    REG_RESOURCE_NAME, REG_TENANT_ID);\nCREATE INDEX REG_RESOURCE_COMMENT_IND_BY_VERSION
    \ ON REG_RESOURCE_COMMENT(REG_VERSION, REG_TENANT_ID);\n\nCREATE SEQUENCE IF NOT
    EXISTS REG_RATING_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_RATING (\n            REG_ID
    \    INTEGER DEFAULT NEXTVAL('REG_RATING_PK_SEQ'),\n            REG_RATING        INTEGER
    NOT NULL,\n            REG_USER_ID       VARCHAR(255) NOT NULL,\n            REG_RATED_TIME
    \   TIMESTAMP NOT NULL,\n            REG_TENANT_ID INTEGER DEFAULT 0,\n            CONSTRAINT
    PK_REG_RATING PRIMARY KEY(REG_ID, REG_TENANT_ID)\n);\n\nCREATE SEQUENCE IF NOT
    EXISTS REG_RESOURCE_RATING_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_RESOURCE_RATING
    (\n            ID                      INTEGER DEFAULT NEXTVAL('REG_RESOURCE_RATING_PK_SEQ'),\n
    \           REG_RATING_ID           INTEGER NOT NULL,\n            REG_VERSION
    \            INTEGER,\n            REG_PATH_ID             INTEGER,\n            REG_RESOURCE_NAME
    \      VARCHAR(256),\n            REG_TENANT_ID INTEGER DEFAULT 0,\n            PRIMARY
    KEY (ID)\n);\n\nALTER TABLE REG_RESOURCE_RATING ADD CONSTRAINT REG_RESOURCE_RATING_FK_BY_PATH_ID
    FOREIGN KEY (REG_PATH_ID, REG_TENANT_ID) REFERENCES REG_PATH (REG_PATH_ID, REG_TENANT_ID);\nALTER
    TABLE REG_RESOURCE_RATING ADD CONSTRAINT REG_RESOURCE_RATING_FK_BY_RATING_ID FOREIGN
    KEY (REG_RATING_ID, REG_TENANT_ID) REFERENCES REG_RATING (REG_ID, REG_TENANT_ID);\nCREATE
    INDEX REG_RESOURCE_RATING_IND_BY_PATH_ID_AND_RESOURCE_NAME  ON REG_RESOURCE_RATING(REG_PATH_ID,
    REG_RESOURCE_NAME, REG_TENANT_ID);\nCREATE INDEX REG_RESOURCE_RATING_IND_BY_VERSION
    \ ON REG_RESOURCE_RATING(REG_VERSION, REG_TENANT_ID);\n\nCREATE SEQUENCE IF NOT
    EXISTS REG_TAG_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_TAG (\n            REG_ID
    \        INTEGER DEFAULT NEXTVAL('REG_TAG_PK_SEQ'),\n            REG_TAG_NAME
    \      VARCHAR(500) NOT NULL,\n            REG_USER_ID        VARCHAR(255) NOT
    NULL,\n            REG_TAGGED_TIME    TIMESTAMP NOT NULL,\n            REG_TENANT_ID
    INTEGER DEFAULT 0,\n            CONSTRAINT PK_REG_TAG PRIMARY KEY(REG_ID, REG_TENANT_ID)\n);\n\nCREATE
    SEQUENCE IF NOT EXISTS REG_RESOURCE_TAG_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_RESOURCE_TAG
    (\n            ID                      INTEGER DEFAULT NEXTVAL('REG_RESOURCE_TAG_PK_SEQ'),\n
    \           REG_TAG_ID              INTEGER NOT NULL,\n            REG_VERSION
    \            INTEGER,\n            REG_PATH_ID             INTEGER,\n            REG_RESOURCE_NAME
    \      VARCHAR(256),\n            REG_TENANT_ID INTEGER DEFAULT 0,\n            PRIMARY
    KEY (ID)\n);\n\nALTER TABLE REG_RESOURCE_TAG ADD CONSTRAINT REG_RESOURCE_TAG_FK_BY_PATH_ID
    FOREIGN KEY (REG_PATH_ID, REG_TENANT_ID) REFERENCES REG_PATH (REG_PATH_ID, REG_TENANT_ID);\nALTER
    TABLE REG_RESOURCE_TAG ADD CONSTRAINT REG_RESOURCE_TAG_FK_BY_TAG_ID FOREIGN KEY
    (REG_TAG_ID, REG_TENANT_ID) REFERENCES REG_TAG (REG_ID, REG_TENANT_ID);\nCREATE
    INDEX REG_RESOURCE_TAG_IND_BY_PATH_ID_AND_RESOURCE_NAME  ON REG_RESOURCE_TAG(REG_PATH_ID,
    REG_RESOURCE_NAME, REG_TENANT_ID);\nCREATE INDEX REG_RESOURCE_TAG_IND_BY_VERSION
    \ ON REG_RESOURCE_TAG(REG_VERSION, REG_TENANT_ID);\n\nCREATE SEQUENCE IF NOT EXISTS
    REG_PROPERTY_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_PROPERTY (\n            REG_ID
    \        INTEGER DEFAULT NEXTVAL('REG_PROPERTY_PK_SEQ'),\n            REG_NAME
    \      VARCHAR(100) NOT NULL,\n            REG_VALUE        VARCHAR(1000),\n            REG_TENANT_ID
    INTEGER DEFAULT 0,\n            CONSTRAINT PK_REG_PROPERTY PRIMARY KEY(REG_ID,
    REG_TENANT_ID)\n);\n\nCREATE SEQUENCE IF NOT EXISTS REG_RESOURCE_PROPERTY_PK_SEQ;\nCREATE
    TABLE IF NOT EXISTS REG_RESOURCE_PROPERTY (\n            ID                      INTEGER
    DEFAULT NEXTVAL('REG_RESOURCE_PROPERTY_PK_SEQ'),\n            REG_PROPERTY_ID
    \        INTEGER NOT NULL,\n            REG_VERSION             INTEGER,\n            REG_PATH_ID
    \            INTEGER,\n            REG_RESOURCE_NAME       VARCHAR(256),\n            REG_TENANT_ID
    INTEGER DEFAULT 0,\n            PRIMARY KEY (ID)\n);\n\nALTER TABLE REG_RESOURCE_PROPERTY
    ADD CONSTRAINT REG_RESOURCE_PROPERTY_FK_BY_PATH_ID FOREIGN KEY (REG_PATH_ID, REG_TENANT_ID)
    REFERENCES REG_PATH (REG_PATH_ID, REG_TENANT_ID);\nALTER TABLE REG_RESOURCE_PROPERTY
    ADD CONSTRAINT REG_RESOURCE_PROPERTY_FK_BY_TAG_ID FOREIGN KEY (REG_PROPERTY_ID,
    REG_TENANT_ID) REFERENCES REG_PROPERTY (REG_ID, REG_TENANT_ID);\nCREATE INDEX
    REG_RESOURCE_PROPERTY_IND_BY_PATH_ID_AND_RESOURCE_NAME  ON REG_RESOURCE_PROPERTY(REG_PATH_ID,
    REG_RESOURCE_NAME, REG_TENANT_ID);\nCREATE INDEX REG_RESOURCE_PROPERTY_IND_BY_VERSION
    \ ON REG_RESOURCE_PROPERTY(REG_VERSION, REG_TENANT_ID);\nCREATE INDEX REG_RESC_PROP_BY_PROP_ID_TI
    ON REG_RESOURCE_PROPERTY(REG_TENANT_ID,REG_PROPERTY_ID);\n\nCREATE SEQUENCE IF
    NOT EXISTS REG_ASSOCIATION_PK_SEQ;\nCREATE TABLE IF NOT EXISTS REG_ASSOCIATION
    (\n            REG_ASSOCIATION_ID INTEGER DEFAULT NEXTVAL('REG_ASSOCIATION_PK_SEQ'),\n
    \           REG_SOURCEPATH VARCHAR (2000) NOT NULL,\n            REG_TARGETPATH
    VARCHAR (2000) NOT NULL,\n            REG_ASSOCIATION_TYPE VARCHAR (2000) NOT
    NULL,\n            REG_TENANT_ID INTEGER DEFAULT 0,\n            PRIMARY KEY (REG_ASSOCIATION_ID,
    REG_TENANT_ID)\n);\n\nCREATE SEQUENCE IF NOT EXISTS REG_SNAPSHOT_PK_SEQ;\nCREATE
    TABLE IF NOT EXISTS REG_SNAPSHOT (\n            REG_SNAPSHOT_ID     INTEGER DEFAULT
    NEXTVAL('REG_SNAPSHOT_PK_SEQ'),\n            REG_PATH_ID            INTEGER NOT
    NULL,\n            REG_RESOURCE_NAME      VARCHAR(255),\n            REG_RESOURCE_VIDS
    \    BYTEA NOT NULL,\n            REG_TENANT_ID INTEGER DEFAULT 0,\n            CONSTRAINT
    PK_REG_SNAPSHOT PRIMARY KEY(REG_SNAPSHOT_ID, REG_TENANT_ID)\n);\n\nCREATE INDEX
    REG_SNAPSHOT_IND_BY_PATH_ID_AND_RESOURCE_NAME  ON REG_SNAPSHOT(REG_PATH_ID, REG_RESOURCE_NAME,
    REG_TENANT_ID);\n\nALTER TABLE REG_SNAPSHOT ADD CONSTRAINT REG_SNAPSHOT_FK_BY_PATH_ID
    FOREIGN KEY (REG_PATH_ID, REG_TENANT_ID) REFERENCES REG_PATH (REG_PATH_ID, REG_TENANT_ID);\n\n\n--
    ################################\n-- USER MANAGER TABLES\n-- ################################\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_TENANT_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_TENANT
    (\n\t\t\tUM_ID INTEGER DEFAULT NEXTVAL('UM_TENANT_PK_SEQ'),\n\t\t\tUM_TENANT_UUID
    VARCHAR(36) NOT NULL,\n\t\t\tUM_DOMAIN_NAME VARCHAR(255) NOT NULL,\n            UM_EMAIL
    VARCHAR(255),\n            UM_ACTIVE BOOLEAN DEFAULT FALSE,\n\t        UM_CREATED_DATE
    TIMESTAMP NOT NULL,\n\t        UM_USER_CONFIG BYTEA,\n\t        UM_ORG_UUID VARCHAR(36)
    DEFAULT NULL,\n\t\t\tPRIMARY KEY (UM_ID),\n\t\t\tUNIQUE(UM_DOMAIN_NAME),\n\t\t\tUNIQUE(UM_TENANT_UUID));\n\nCREATE
    INDEX INDEX_UM_TENANT_UM_DOMAIN_NAME\n                    ON UM_TENANT (UM_DOMAIN_NAME);
    \n\nCREATE INDEX INDEX_UM_TENANT_ORG_UUID ON UM_TENANT(UM_ORG_UUID);\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_DOMAIN_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_DOMAIN(\n
    \           UM_DOMAIN_ID INTEGER DEFAULT NEXTVAL('UM_DOMAIN_PK_SEQ'),\n            UM_DOMAIN_NAME
    VARCHAR(255) NOT NULL,\n            UM_TENANT_ID INTEGER DEFAULT 0,\n            PRIMARY
    KEY (UM_DOMAIN_ID, UM_TENANT_ID),\n            UNIQUE(UM_DOMAIN_NAME,UM_TENANT_ID)\n);\n\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_USER_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_USER ( \n
    \            UM_ID INTEGER DEFAULT NEXTVAL('UM_USER_PK_SEQ'), \n             UM_USER_ID
    VARCHAR(255) NOT NULL,\n             UM_USER_NAME VARCHAR(255) NOT NULL,\n             UM_USER_PASSWORD
    VARCHAR(255) NOT NULL,\n             UM_SALT_VALUE VARCHAR(31),\n             UM_REQUIRE_CHANGE
    BOOLEAN DEFAULT FALSE,\n             UM_CHANGED_TIME TIMESTAMP NOT NULL,\n             UM_TENANT_ID
    INTEGER DEFAULT 0, \n             PRIMARY KEY (UM_ID, UM_TENANT_ID), \n             UNIQUE(UM_USER_ID)\n);\n\nCREATE
    UNIQUE INDEX INDEX_LOWER_UM_USER_NAME_UM_TENANT_ID ON UM_USER(LOWER(UM_USER_NAME),
    UM_TENANT_ID);\n\nCREATE INDEX IDX_UU_LO_UI_UUN_TI ON UM_USER(UM_ID, LOWER(UM_USER_NAME),
    UM_TENANT_ID);\n\nCREATE SEQUENCE IF NOT EXISTS UM_SYSTEM_USER_PK_SEQ;\nCREATE
    TABLE IF NOT EXISTS UM_SYSTEM_USER ( \n             UM_ID INTEGER DEFAULT NEXTVAL('UM_SYSTEM_USER_PK_SEQ'),
    \n             UM_USER_NAME VARCHAR(255) NOT NULL, \n             UM_USER_PASSWORD
    VARCHAR(255) NOT NULL,\n             UM_SALT_VALUE VARCHAR(31),\n             UM_REQUIRE_CHANGE
    BOOLEAN DEFAULT FALSE,\n             UM_CHANGED_TIME TIMESTAMP NOT NULL,\n             UM_TENANT_ID
    INTEGER DEFAULT 0, \n             PRIMARY KEY (UM_ID, UM_TENANT_ID)\n);\n\nCREATE
    UNIQUE INDEX UM_SYSTEM_USER_LOWER_UM_USER_NAME_UM_TENANT_ID ON UM_SYSTEM_USER(LOWER(UM_USER_NAME),
    UM_TENANT_ID);\n\nCREATE SEQUENCE IF NOT EXISTS UM_ROLE_PK_SEQ;\nCREATE TABLE
    IF NOT EXISTS UM_ROLE ( \n             UM_ID INTEGER DEFAULT NEXTVAL('UM_ROLE_PK_SEQ'),\n
    \            UM_ROLE_UUID VARCHAR(255) NOT NULL,\n             UM_ROLE_NAME VARCHAR(255)
    NOT NULL,\n             UM_TENANT_ID INTEGER DEFAULT 0,\n\t\tUM_SHARED_ROLE BOOLEAN
    DEFAULT FALSE,\n             UM_CREATED_TIME TIMESTAMP NOT NULL,\n             UM_LAST_MODIFIED
    TIMESTAMP NOT NULL,\n             PRIMARY KEY (UM_ID, UM_TENANT_ID),\n             UNIQUE(UM_ROLE_UUID),\n
    \            UNIQUE(UM_ROLE_NAME, UM_TENANT_ID)\n);\n\n\nCREATE SEQUENCE IF NOT
    EXISTS UM_MODULE_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_MODULE(\n\tUM_ID INTEGER
    \ DEFAULT NEXTVAL('UM_MODULE_PK_SEQ'),\n\tUM_MODULE_NAME VARCHAR(100),\n\tUNIQUE(UM_MODULE_NAME),\n\tPRIMARY
    KEY(UM_ID)\n);\n\nCREATE TABLE IF NOT EXISTS UM_MODULE_ACTIONS(\n\tUM_ACTION VARCHAR(255)
    NOT NULL,\n\tUM_MODULE_ID INTEGER NOT NULL,\n\tPRIMARY KEY(UM_ACTION, UM_MODULE_ID),\n\tFOREIGN
    KEY (UM_MODULE_ID) REFERENCES UM_MODULE(UM_ID) ON DELETE CASCADE\n);\n\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_PERMISSION_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_PERMISSION
    ( \n             UM_ID INTEGER DEFAULT NEXTVAL('UM_PERMISSION_PK_SEQ'), \n             UM_RESOURCE_ID
    VARCHAR(255) NOT NULL, \n             UM_ACTION VARCHAR(255) NOT NULL, \n             UM_TENANT_ID
    INTEGER DEFAULT 0, \n\t     UM_MODULE_ID INTEGER DEFAULT 0,\n\t         \t UNIQUE(UM_RESOURCE_ID,UM_ACTION,
    UM_TENANT_ID),\n             PRIMARY KEY (UM_ID, UM_TENANT_ID)\n); \n\nCREATE
    INDEX INDEX_UM_PERMISSION_UM_RESOURCE_ID_UM_ACTION \n                    ON UM_PERMISSION
    (UM_RESOURCE_ID, UM_ACTION, UM_TENANT_ID); \n\n\t\t\t\t\t\nCREATE SEQUENCE IF
    NOT EXISTS UM_ROLE_PERMISSION_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_ROLE_PERMISSION
    ( \n             UM_ID INTEGER DEFAULT NEXTVAL('UM_ROLE_PERMISSION_PK_SEQ'), \n
    \            UM_PERMISSION_ID INTEGER NOT NULL, \n             UM_ROLE_NAME VARCHAR(255)
    NOT NULL,\n             UM_IS_ALLOWED SMALLINT NOT NULL, \n             UM_TENANT_ID
    INTEGER DEFAULT 0, \n\t     UM_DOMAIN_ID INTEGER,\n             FOREIGN KEY (UM_PERMISSION_ID,
    UM_TENANT_ID) REFERENCES UM_PERMISSION(UM_ID, UM_TENANT_ID) ON DELETE CASCADE,\n\t
    \    FOREIGN KEY (UM_DOMAIN_ID, UM_TENANT_ID) REFERENCES UM_DOMAIN(UM_DOMAIN_ID,
    UM_TENANT_ID) ON DELETE CASCADE, \n             PRIMARY KEY (UM_ID, UM_TENANT_ID)
    \n);\n\nCREATE INDEX INDEX_ROLE_PERMSN_TI_RN ON UM_ROLE_PERMISSION(UM_TENANT_ID,UM_ROLE_NAME);\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_USER_PERMISSION_PK_SEQ;\nCREATE TABLE IF NOT EXISTS
    UM_USER_PERMISSION ( \n             UM_ID INTEGER DEFAULT NEXTVAL('UM_USER_PERMISSION_PK_SEQ'),
    \n             UM_PERMISSION_ID INTEGER NOT NULL, \n             UM_USER_NAME
    VARCHAR(255) NOT NULL,\n             UM_IS_ALLOWED SMALLINT NOT NULL,          \n
    \            UM_TENANT_ID INTEGER DEFAULT 0, \n             FOREIGN KEY (UM_PERMISSION_ID,
    UM_TENANT_ID) REFERENCES UM_PERMISSION(UM_ID, UM_TENANT_ID) ON DELETE CASCADE,\n
    \            PRIMARY KEY (UM_ID, UM_TENANT_ID)\n);\n\nCREATE INDEX UM_USER_PERMISSION_UM_PERMISSION_ID_LOWER_UM_USER_NAME_UM_TENANT_ID
    ON\n            UM_USER_PERMISSION(UM_PERMISSION_ID, LOWER(UM_USER_NAME), UM_TENANT_ID);\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_USER_ROLE_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_USER_ROLE
    ( \n             UM_ID INTEGER DEFAULT NEXTVAL('UM_USER_ROLE_PK_SEQ'), \n             UM_ROLE_ID
    INTEGER NOT NULL, \n             UM_USER_ID INTEGER NOT NULL,\n             UM_TENANT_ID
    INTEGER DEFAULT 0,  \n             UNIQUE (UM_USER_ID, UM_ROLE_ID, UM_TENANT_ID),
    \n             FOREIGN KEY (UM_ROLE_ID, UM_TENANT_ID) REFERENCES UM_ROLE(UM_ID,
    UM_TENANT_ID),\n             FOREIGN KEY (UM_USER_ID, UM_TENANT_ID) REFERENCES
    UM_USER(UM_ID, UM_TENANT_ID),\n             PRIMARY KEY (UM_ID, UM_TENANT_ID)\n);
    \n\nCREATE SEQUENCE IF NOT EXISTS UM_SHARED_USER_ROLE_PK_SEQ;\nCREATE TABLE IF
    NOT EXISTS UM_SHARED_USER_ROLE(\n    ID         INTEGER DEFAULT NEXTVAL('UM_SHARED_USER_ROLE_PK_SEQ'),\n
    \   UM_ROLE_ID INTEGER NOT NULL,\n    UM_USER_ID INTEGER NOT NULL,\n    UM_USER_TENANT_ID
    INTEGER NOT NULL,\n    UM_ROLE_TENANT_ID INTEGER NOT NULL,\n    UNIQUE(UM_USER_ID,UM_ROLE_ID,UM_USER_TENANT_ID,
    UM_ROLE_TENANT_ID),\n    FOREIGN KEY(UM_ROLE_ID,UM_ROLE_TENANT_ID) REFERENCES
    UM_ROLE(UM_ID,UM_TENANT_ID) ON DELETE CASCADE ,\n    FOREIGN KEY(UM_USER_ID,UM_USER_TENANT_ID)
    REFERENCES UM_USER(UM_ID,UM_TENANT_ID) ON DELETE CASCADE,\n    PRIMARY KEY (ID)\n);\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_ACCOUNT_MAPPING_SEQ;\nCREATE TABLE IF NOT EXISTS UM_ACCOUNT_MAPPING(\n\tUM_ID
    INTEGER DEFAULT NEXTVAL('UM_ACCOUNT_MAPPING_SEQ'),\n\tUM_USER_NAME VARCHAR(255)
    NOT NULL,\n\tUM_TENANT_ID INTEGER NOT NULL,\n\tUM_USER_STORE_DOMAIN VARCHAR(100),\n\tUM_ACC_LINK_ID
    INTEGER NOT NULL,\n\tFOREIGN KEY (UM_TENANT_ID) REFERENCES UM_TENANT(UM_ID) ON
    DELETE CASCADE,\n\tPRIMARY KEY (UM_ID)\n);\n\nCREATE UNIQUE INDEX UM_ACCOUNT_MAPPING_LOWER_UM_USER_NAME_UM_TENANT_ID_UM_USER_STORE_DOMAIN_UM_ACC_LINK_ID
    ON UM_ACCOUNT_MAPPING(LOWER(UM_USER_NAME), UM_TENANT_ID, UM_USER_STORE_DOMAIN,
    UM_ACC_LINK_ID);\n\nCREATE SEQUENCE IF NOT EXISTS UM_USER_ATTRIBUTE_PK_SEQ;\nCREATE
    TABLE IF NOT EXISTS UM_USER_ATTRIBUTE ( \n            UM_ID INTEGER DEFAULT NEXTVAL('UM_USER_ATTRIBUTE_PK_SEQ'),
    \n            UM_ATTR_NAME VARCHAR(255) NOT NULL, \n            UM_ATTR_VALUE
    VARCHAR(1024), \n            UM_PROFILE_ID VARCHAR(255), \n            UM_USER_ID
    INTEGER, \n            UM_TENANT_ID INTEGER DEFAULT 0, \n            FOREIGN KEY
    (UM_USER_ID, UM_TENANT_ID) REFERENCES UM_USER(UM_ID, UM_TENANT_ID), \n            PRIMARY
    KEY (UM_ID, UM_TENANT_ID)\n); \n\nCREATE INDEX UM_USER_ID_INDEX ON UM_USER_ATTRIBUTE(UM_USER_ID);\nCREATE
    INDEX UM_ATTR_NAME_VALUE_INDEX ON UM_USER_ATTRIBUTE(UM_ATTR_NAME, UM_ATTR_VALUE);\n\nCREATE
    SEQUENCE IF NOT EXISTS UM_DIALECT_PK_SEQ;\nCREATE TABLE IF NOT EXISTS UM_DIALECT(
