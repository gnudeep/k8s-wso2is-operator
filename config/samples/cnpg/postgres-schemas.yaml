    TABLE IF NOT EXISTS UM_SHARED_RESOURCE_ATTRIBUTES (\n    UM_ID INTEGER DEFAULT
    NEXTVAL('UM_SHARED_RESOURCE_ATTRIBUTES_PK_SEQ'),\n    UM_RESOURCE_SHARING_POLICY_ID
    INTEGER NOT NULL,\n    UM_SHARED_ATTRIBUTE_TYPE VARCHAR(255) NOT NULL,\n    UM_SHARED_ATTRIBUTE_ID
